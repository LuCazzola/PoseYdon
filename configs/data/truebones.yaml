root: data/truebones
# A rig is a directory `data/truebones/rigs/<Rig>/` holding `manifest.yaml`
# (plus its stage-1/stage-2 artefacts) -- not the `skeletons/` directory the
# entity-first layout migration deleted.
manifests: data/truebones/rigs
index: data/truebones/index.jsonl

batch_size: 8
num_workers: 0

window:
  _target_: poseydon.data.window.RandomCrop
  length: 40
