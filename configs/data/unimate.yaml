# UniMate's Truebones recipe (arXiv 2609.05415) rebuilt in PoseYdon, switchable
# part by part. The stage-2 sections below are filled by later tasks.
# Manifests are generated, not authored: tools/write_unimate_manifests.py.
#
# Built by: scripts/process_dataset_truebones.py (stage 1) and
# scripts/build_features.py (stage 2), both through `configs/build.yaml`.

custom_imports: []

paths:
  raw: data/_raw/truebones             # UniMate reads the same Truebones release
  root: data/unimate
  rigs: data/unimate/rigs
  index: data/unimate/index.jsonl

source:
  type: fbx_cache
  # UniMate's own clip index (HF Truebones-ZOO-Annotations, `clips.csv`): the
  # `linked` rows are its clips.
  index: data/_raw/UniML3D/truebones_annotations/clips.csv
  cache: data/unimate/cache/fbx        # scripts/build_fbx_cache.py
  # UniMate's export skip list (data/_raw/UniML3D/export/truebones/filtered_clips.txt).
  skip: data/_raw/UniML3D/export/truebones/filtered_clips.txt

prepare:
  # UniMate's order: rig cleanup, BFS joint order, then canonicalization (face,
  # centre XZ, scale, ground; `canonicalize_anim`). No `rest_relative`,
  # `face_rest_axis` or `promote_root`: UniMate has no counterpart.
  - {type: up_axis}
  - {type: prune_unskinned}
  - {type: bfs_order}
  - {type: enforce_rigid, joint_translation: drop}   # UniMate rebuilds positions from rest offsets, only the root moves
  - {type: face_axis, axis: "+Z", on_degenerate: nearest}
  - {type: centre_xz_clip}
  - {type: scale, mode: diameter, target: 2.0}
  - {type: ground_clip}

# UniMate's frame and clip filters (`src/poseydon/build/clips.py`), in its order:
# the source ops run before `prepare`, the rest on the prepared clip. A skip list
# that does not exist is a no-op (UniMate's "auto"); Truebones ships only
# filtered_clips.txt (`source.skip`).
clips:
  - {type: joint_range, min: 8, max: 150}
  - {type: head_trim, file: data/_raw/UniML3D/export/truebones/clip_trims.txt}
  - {type: halve_fps}
  - {type: trim_static, threshold: 1.0e-5}
  - {type: min_frames, n: 8}
  - {type: max_length, frames: 200, mode: first}   # their default; `windows` strides 110
  - {type: low_activity, threshold: 0.02, top_k_ratio: 0.25, top_k_min: 2, keep_file: data/_raw/UniML3D/export/truebones/activity_keep.txt}
  - {type: jump, step: 0.2, ratio: 8.0}

# UniMate keeps every joint its pruning leaves (`prepare` above).
reduce: []

# Below: PoseYdon defaults, not part of UniMate's recipe, copied from
# truebones.yaml so the config composes.
labels:
  joint_names: {type: humanize, lowercase: true, expand_sides: true}
  contact:
    max_height: 0.30
    max_speed: 0.044721359549995794

corpus: {type: per_rig_directory, pattern: "*.bvh"}

filter:
  blacklist:
    skeletons: []
    clips: []

loader:
  batch_size: 16
  num_workers: 4
  balanced: true
  window: {type: random_crop, length: 40}
