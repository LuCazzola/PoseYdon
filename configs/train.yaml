# Compose with CLI overrides, e.g.
#   poseydon train model=anytop process=flow features=[rot6d,local_vel]
defaults:
  - data: truebones
  # The stage-2 build group. Composed here so the recipe records the reduction
  # tolerance and the normalization policy the corpus was built under as REAL
  # values: recorded as `null` they sat in `CHECKED` comparing None against
  # None, two of six entries in the list that decides whether a checkpoint is
  # safe to sample, contributing nothing while looking like the four that do.
  # `configs/sample.yaml` composes the same group -- one-sided composition
  # would reject every legitimate sample.
  - dataset: truebones
  - model: modiffae
  - process: gaussian
  - trainer: default
  - _self_

seed: 0

# Feature blocks, in order. Changing this needs no re-ingest: ingest stores the
# canonical animation, and features are composed when the data is read.
features: [ric_pos, rot6d, local_vel, foot_contact]

# Only declared conditioning is loaded, collated and moved to device.
conditioners: [topology, tpose, norm_stats, joint_names]

# Structural or feature-space edits applied per-sample at read time, each
# gated by its own probability and applied in the declared order.
#
# Matches the reference's per-sample augmentation
# (data_loaders/truebones/data/dataset.py::MotionDataset.augment): for each
# training sample it draws `aug_type = random.choice([0, 1, 2])` -- a uniform
# 1/3 chance of no augmentation, 1/3 drop, 1/3 duplicate -- with the removal
# rate itself drawn uniformly from {0.1, 0.2, 0.3}.
#
# This pipeline's entries fire INDEPENDENTLY (p=1/3 each below), not as one
# mutually-exclusive draw, since composability -- not replicating that
# specific exclusivity -- is the point of this design (see the augmentation
# design spec). That reproduces the reference's per-type marginal rate
# exactly (each fires on 1/3 of samples) while occasionally applying both to
# the same sample, which the reference's single random.choice never does.
# Set either p to 0 to fall back to a strictly one-or-the-other-or-neither
# schedule, or override with `augmentations=[]` to disable entirely.
augmentations:
  - _target_: poseydon.augment.DropEndEffector
    p: 0.3333333333333333
    rate: [0.1, 0.2, 0.3]
  - _target_: poseydon.augment.DuplicateJoint
    p: 0.3333333333333333

# Weighted loss terms. Each declares the feature blocks it needs, checked
# against `features` above before the first step.
# `--lambda_geo 1.0` is passed explicitly by the reference's paper command;
# `--lambda_fs` defaults to 0 there and is never passed. Foot skate stays a
# MEASURED diagnostic (Plan B's validation scalar), not a training term -- the
# shipped `geodesic: 0.1, footskate: 0.5` was neither the reference nor a
# measured choice.
losses:
  simple: 1.0
  geodesic: 1.0

optimizer:
  learning_rate: 1e-4
  weight_decay: 0.0

# Retargeting, watched during training. Training loss says the model denoises;
# it says nothing about whether a Flamingo's semantics land on a Scorpion --
# and that is the task. Each firing writes `.npz` + `.bvh` + `.mp4` per pair
# and logs six scalars, uploading all three files as ONE wandb artifact aliased
# with the step (a video renders but cannot be diffed or opened in Blender).
#
# `every_n_steps` matches the checkpoint interval, so every observation has a
# checkpoint beside it. Drop the whole block to train without it.
validation:
  every_n_steps: 25000
  run_at_start: true
  # Classifier-free guidance strength for the OBSERVATION, not for training.
  # OFF, and off is a measurement rather than caution: against this project's
  # own 25k checkpoint (trained at `model.cond_drop: 0.1`), a scale of 2.5 made
  # 9 of 10 retarget metrics worse -- bone-length drift 0.080 -> 0.093 and IK
  # residual 0.080 -> 0.096 on Scorpion, foot skate 0.066 -> 0.116 on Raptor.
  # Only one number improved, and the harm is MONOTONE in the scale: at 1.25
  # it is 3 better / 7 worse, at 2.5 it is 1 better / 9 worse. So this is not a
  # mistuned scale, it is guidance not helping this task yet.
  #
  # The reading is that a retarget's conditional
  # branch is already maximally specified -- `LatentPin` pins an exact z_sem --
  # so extrapolating away from a weakly-modelled unconditional branch buys no
  # sharpening and costs manifold drift, which is precisely what those two
  # metrics measure.
  #
  # Turn it on to watch guidance rather than to improve the metric, and expect
  # to re-measure late in training: the null latent at 25k has seen gradient
  # from only ~10% of samples. A second forward pass per denoising step, three
  # pairs every 25k steps, is nothing next to the 100-step DDPM it wraps.
  guidance_scale: 0.0
  pairs:
    - {content: {rig: Flamingo, action: onelegbent}, target: Scorpion}
    - {content: {rig: Coyote,   action: attack3},    target: Crab}
    - {content: {rig: Goat,     action: headbutt},   target: Raptor}
