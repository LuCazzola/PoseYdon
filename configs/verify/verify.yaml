# The motion verifier's knobs and smoke set (scripts/verify_motion.py).
n_frames: 8
inventory_tol: 1.0e-6    # C1, bind matrices
skin_tol: 1.0e-3        # C2a, fraction of rig extent; floor 7.4e-16 on the smoke set (build --floor, 2026-11-07)
untraced_tol: 1.0e-3    # C2b, fraction of rig extent; float32 key floor through judge on `build --smoke --floor`, 2026-11-07: vertices 8.8e-8 to 6.9e-6 (Camel), joints 4.6e-8 to 6.9e-6, rotations 2.4e-13 to 9.2e-7
untraced_rot_tol: 1.0e-4 # C2b, joint world rotation, largest matrix element difference (test_round_trip_fbx's FBX_TOL); floor above
# C3-placement bounds. Measured on `build --smoke` + `judge`, 2026-11-08 (tmp/verify/t5), all 20 canonical files:
# scale ratio 1.3e-8 to 3.9e-5, rotation 5e-6 to 5.2e-3 deg, offset 4e-8 to 2.0e-5 of extent.
# Bear angeryswat 3_model sits at 0.51 of the rotation bound: the recorded `space` is solved on joints, the fit on
# vertices, and the two differ once the twist joints drop. The bounds were set before the run and not widened.
placement_scale_tol: 1.0e-4    # fitted scale against the recorded one, as a ratio
placement_rotation_deg: 0.01   # the whole rotation between the fitted and the recorded, degrees
placement_offset_tol: 1.0e-4   # offset difference as a fraction of rig extent
stretch_margin: 1.1
# Rigs that each broke something (Tukan and Crow are the promoted-root rigs), each at
# the rig's default clip, plus the extra clips listed under `extra`.
smoke:
  truebones: [Goat, Crow, Anaconda, Bear, KingCobra, Camel, Tukan, Dog]
  unimate: [Scorpion2]
  extra: {Bear: [feast]}
# C4-pose bounds, set before the run; measured on `build --smoke` + `judge`, 2026-11-08 (tmp/verify/t6s), 10 runs: up and facing
# at most 1.0e-4 deg, ground at most 7.6e-7 of extent (mesh mode; Tukan, joints mode, 2.0e-9). C4-mesh vertices 2.3e-7 to 2.0e-6.
zero_facing_deg: 0.01    # up and facing of the zero file against +Y and +Z, degrees
zero_ground_tol: 1.0e-4  # the lowest vertex (mesh mode) or joint at y = 0, fraction of extent
# C5-stability bound. With no model in phase 1 the smoke round trips ARE the floor: 1.7e-7 to 1.2e-6 of extent on all 10 runs
# (`build --smoke` + `judge`, 2026-11-08, tmp/verify/t7s; that judge ran at 1e-3, the bound was set after). The bound is 10x the worst.
stability_tol: 1.0e-5   # C5-stability, fraction of extent after one fitted similarity
# C5-joints: margin and floor are PLACEHOLDERS, no value is chosen. Leave-one-out over each smoke rig's vendor clips (each clip judged
# against limits built from the others; tmp/verify/limits, .superpowers/probe/loo.py, 2026-11-08) fails at every cell of floor {1, 2} deg
# x margin {1.1, 1.5, 2, 3}: 93, 58, 42, 23 clips of 218 at floor 1 and 92, 57, 40, 23 at floor 2. That is an owner decision (docs/reference/tooling.md).
joint_margin: 1.1
joint_floor_deg: 1.0e-3  # C5-joints, the smallest limit a joint gets (swing, twist, speed) so one no vendor clip moves cannot fail on noise
