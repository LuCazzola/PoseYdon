# Stage 2. Each pluggable behaviour is a `_target_`; each value is a plain key.
root: data/truebones
schema: [ric_pos, rot6d, local_vel, foot_contact]

corpus: {_target_: poseydon.build.corpus.PerRigDirectory, pattern: "*.bvh"}
names:  {_target_: poseydon.build.names.Humanize, lowercase: true, expand_sides: true}

# T5 stays behind the poseydon[text] extra: the test image deliberately excludes
# transformers, so the suite must never require it and a corpus must build
# without it.
text: null

reduce_tolerance: 1.0e-8

# Parity spec §5. Per-block policy: `ric_pos`, `rot6d` and `local_vel` are all
# centred and scaled per joint block; `foot_contact` is a {0,1} flag, left
# un-centred and unscaled (`scale: none`).
#
# `rot6d` USED TO SHIP `center: false`, on the argument that "a 6D rotation has
# no zero to centre around". That argument is about reconstruction, and it does
# not survive contact with the data. Measured over six rigs, un-centred `rot6d`
# normalizes to mean +4.697, std 29.450, max 620.6 -- i.e. not normalized at
# all, because dividing an un-centred value by the std ABOUT ITS MEAN leaves
# the whole mean offset behind, scaled up. Centring it gives mean 0.000, std
# 0.971, max 18.4, and drops the `simple` loss from ~1e3 to ~1. The reference
# centres its rotations too: its `cond.npy` carries a real per-channel mean
# (|avg| 0.44) and std (0.18) for the rot6d columns, so `center: false` was
# never the faithful choice either.
#
# Centring is safe precisely because it is a STORAGE transform and exactly
# invertible: every loss that needs true rotations reads through
# `losses/base.py::raw_block`, which undoes normalization first. That helper is
# why a 6D row's validity is not a normalization concern.
#
# Note, separate from what is declared above: `scale: block` with
# `center: true` on EVERY block is an alternative combination -- the one the
# parity test uses to check reference-exactness -- not what this config ships.
#
# Each entry carries its own `_target_` so `hydra.utils.instantiate` recurses
# into this list and returns `BlockPolicy` instances, not plain mappings -- a
# bare list of dicts is not something Hydra turns into dataclasses on its own,
# and a `BuildConfig` holding dicts here fails deep inside `Normalizer.fit`
# (`entry.name`/`entry.scale` attribute access on a dict), far from where the
# mistake was made. `scripts/build_features.py` also asserts the instantiated
# type before calling `build_all`, so a config that forgets `_target_` fails
# at load time with a clear message instead.
normalize:
  - {_target_: poseydon.data.normalize.BlockPolicy, name: ric_pos,      center: true,  scale: joint_block}
  - {_target_: poseydon.data.normalize.BlockPolicy, name: rot6d,        center: true,  scale: joint_block}
  - {_target_: poseydon.data.normalize.BlockPolicy, name: local_vel,    center: true,  scale: joint_block}
  - {_target_: poseydon.data.normalize.BlockPolicy, name: foot_contact, center: false, scale: none}
