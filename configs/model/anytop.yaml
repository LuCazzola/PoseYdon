_target_: poseydon.models.anytop.AnyTop
d_model: 256
n_layers: 8
n_heads: 4
ff_size: 1024
dropout: 0.1
value_bias: false
# Without this, `AnyTop.name_projection` stays `None` and joint-name
# embeddings (`cond["joint_names"]`) are accepted and silently ignored
# (models/anytop.py:139). The embeddings themselves are not built in this
# plan -- this closes the config hole now so it doesn't become a silent
# no-op later.
name_embedding_dim: 768
# Attention locality: a frame attends only the 31-frame neighbourhood centred
# on it, matching the reference's `--temporal_window 31`. Intersected with the
# padding mask inside the model, never routed through conditioning -- a
# conditioner's `collate` is not told the batch's frame count.
temporal_window: 31
