_target_: poseydon.models.modiffae.MoDiffAE
d_model: 128
n_layers_semantic: 4
n_layers_stochastic: 4
n_heads: 4
ff_size: 512
dropout: 0.1
n_virtual_joints: 5
kl_bottleneck: false
# Attention locality: a frame attends only the 31-frame neighbourhood centred
# on it, matching the reference's `--temporal_window 31`. Intersected with the
# padding mask inside the model, never routed through conditioning -- a
# conditioner's `collate` is not told the batch's frame count.
temporal_window: 31
# NOT `name_embedding_dim: 768` here: `MoDiffAE.__init__` (models/modiffae.py)
# takes no such keyword -- its equivalent hook is `text_dim` (default 768,
# already set), which sizes `InputProcess.text_embedding` and is applied
# unconditionally to `cond["joint_names"]` whenever that key is present, with
# no `is not None` gate to leave dangling the way `AnyTop.name_projection`
# does. Adding `name_embedding_dim` here would raise `TypeError` at
# instantiation, so the config hole this closes for AnyTop does not exist
# for this model.
