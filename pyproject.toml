[project]
name = "poseydon"
version = "0.1.0"
description = "Modular deep learning on motion"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6",
    "torch>=2.4",
    "lightning>=2.3",
    "hydra-core>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "poseydon[render]"]
# Rendering is optional: training and sampling never need it.
render = ["matplotlib>=3.8", "imageio>=2.34", "imageio-ffmpeg>=0.5"]
# Which torch build. Exactly one of these two is always selected (see
# `conflicts` below): `cpu` for the test and compat images, a fraction of the
# CUDA wheel's size, and `cu130` for training on the GB10.
cpu = ["torch>=2.4"]
cu130 = ["torch>=2.4"]
# Training-only: run logging.
train = ["wandb>=0.17"]
# The published reference implementation and what its scripts import, for the
# parity tools in tools/reference/. Never a dependency of the suite.
compat = [
    "motion",
    "transformers",
    "sentencepiece",
    "num2words",
    "einops",
    "blobfile",
    "moviepy<2",
    "poseydon[render]",
]

[tool.uv]
# Every image is Linux on aarch64 (the GB10) or x86_64; the lock need not
# solve for anything else.
environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]
# Unpinned upstream; uv.lock pins the commit.
motion = { git = "https://github.com/inbar-2344/Motion.git" }

# Its setup.py needs setuptools older than 81 to build.
[tool.uv.extra-build-dependencies]
motion = ["setuptools<81", "wheel"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
poseydon = "poseydon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poseydon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Makes `import poseydon` work from the src layout without installing the
# project, which keeps the Docker image's dependency layer independent of source.
pythonpath = ["src", "."]
# pytest's own default norecursedirs includes "build", which silently prunes
# tests/build/ (a package under test, not an artifact directory) from any run
# that scans a directory rather than naming a file. Restated without "build".
norecursedirs = ["*.egg", ".*", "_darcs", "CVS", "dist", "node_modules", "venv", "{arch}"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
