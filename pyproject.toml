[project]
name = "poseydon"
version = "0.1.0"
description = "Modular deep learning on motion"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6",
    "torch>=2.4",
    "lightning>=2.3",
    "hydra-core>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "poseydon[render]"]
# Rendering is optional: training and sampling never need it.
render = ["matplotlib>=3.8", "imageio>=2.34", "imageio-ffmpeg>=0.5"]

# The test image installs CPU-only torch: it is a fraction of the size of the
# default CUDA wheel and nothing in the test suite needs a GPU. Real training
# should use an image built against the appropriate CUDA wheel instead.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
poseydon = "poseydon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poseydon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Makes `import poseydon` work from the src layout without installing the
# project, which keeps the Docker image's dependency layer independent of source.
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
