# Renders docs/. The nav is explicit so the guides read in order; a page
# left out of it fails `mkdocs build --strict` (omitted_files below). Serve with
#   uvx --from 'mkdocs<2' --with mkdocs-material --with 'mkdocstrings[python]' mkdocs serve
# mkdocs is pinned below 2: Material does not support MkDocs 2.0.
site_name: PoseYdon
site_description: Research infrastructure for neural motion.
site_url: https://lucazzola.github.io/PoseYdon/
repo_url: https://github.com/LuCazzola/PoseYdon
edit_uri: ""

docs_dir: docs
# The ticket scripts sit beside the page that documents them, not on the site.
exclude_docs: |
  reference/*.py

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}
plugins:
  - search
  # API reference, generated from the docstrings by static analysis: nothing
  # is imported, so the site still builds without poseydon's dependencies.
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_submodules: true
            show_source: false
            members_order: source
            # Each page names its modules one `:::` line at a time, so each
            # module gets its own heading (and the package's re-exports in
            # `__all__` are not rendered a second time).
            show_root_heading: true
            heading_level: 2
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        # Class `diagram`, not `mermaid`: Material's own Mermaid integration
        # stays out of it, and javascripts/diagrams.js draws them instead
        # (why: the comment at the top of that file).
        - name: mermaid
          class: diagram
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js
  - https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js
  - javascripts/diagrams.js
extra_css:
  - stylesheets/diagrams.css
  - stylesheets/extra.css
# Broken #anchors are only INFO by default, so --strict would not catch them.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
# Docstring edits live-reload too.
watch:
  - src
nav:
  - Home: index.md
  - User Guide:
      - Design rationale: user-guide/index.md
      - Overview: user-guide/overview.md
      - The round trip: user-guide/roundtrip.md
  - How-to:
      - Tutorials:
          - 1. Setting up: how-to/tutorials/01-setup.md
          - 2. Building the dataset: how-to/tutorials/02-build-a-corpus.md
          - 3. Train, generate, export: how-to/tutorials/03-train-and-generate.md
      - Tasks:
          - Overview: how-to/tasks/index.md
          - Generate: how-to/tasks/generate.md
          - In-between: how-to/tasks/inbetween.md
          - Blend: how-to/tasks/blend.md
          - Retarget: how-to/tasks/retarget.md
      - Adding to PoseYdon: how-to/adding.md
      - Testing: how-to/testing.md
  - Index:
      - Map: reference/map.md
      - Glossary and conventions: reference/glossary.md
      - Data formats: reference/data-formats.md
      - Tooling: reference/tooling.md
      - Issues & Ideas: reference/ideas.md
  - API:
      - api/index.md
      - Retargeting: api/retargeting.md
      - augment:
          - api/augment/index.md
      - build:
          - api/build/index.md
          - preparation: api/build/preparation.md
      - conditioners:
          - api/conditioners/index.md
      - core:
          - api/core/index.md
      - data:
          - api/data/index.md
      - export:
          - api/export/index.md
      - features:
          - api/features/index.md
          - reconstruction: api/features/reconstruction.md
          - reduction: api/features/reduction.md
      - ingest:
          - api/ingest/index.md
      - io:
          - api/io/index.md
      - losses:
          - api/losses/index.md
      - models:
          - api/models/index.md
          - models.modules: api/models/modules/index.md
      - ops:
          - api/ops/index.md
      - process:
          - api/process/index.md
      - sampling:
          - api/sampling/index.md
          - sampling.controls: api/sampling/controls/index.md
      - solvers:
          - api/solvers/index.md
      - training:
          - api/training/index.md
