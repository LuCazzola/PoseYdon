services:
  test:
    build: .
    working_dir: /app
    # Run as the host user so files the container writes into the bind mount are
    # owned by you, not root. Without this, anything ingest writes into the repo
    # becomes undeletable from the host.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      # Source, tests and the read-only reference checkout are bind-mounted, so
      # edits take effect with no rebuild. Only pyproject.toml changes require one.
      - .:/app
    environment:
      # pytest gets this from `pythonpath` in pyproject.toml, but ad-hoc
      # `python -c` / `python -m poseydon.cli` runs need it explicitly, since the
      # image installs dependencies without installing the project itself.
      PYTHONPATH: /app/src:/app
    command: pytest -v

  # Reference comparison only. Not used by the test suite.
  compat:
    build:
      context: .
      dockerfile: Dockerfile.compat
    working_dir: /app
    volumes:
      - .:/app
      - hf-cache:/root/.cache/huggingface
    environment:
      PYTHONPATH: /app/src:/app
    command: python -c "import Animation, BVH, Quaternions; print('Motion available')"

volumes:
  hf-cache:
