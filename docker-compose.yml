services:
  test:
    build: .
    working_dir: /app
    # Run as the host user so files the container writes into the bind mount are
    # owned by you, not root. Without this, anything ingest writes into the repo
    # becomes undeletable from the host. Bash does not export UID, so ${UID:-1000}
    # always defaulted to 1000 until .env was added; Compose loads .env automatically.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      # Source, tests and the read-only reference checkout are bind-mounted, so
      # edits take effect with no rebuild. Only pyproject.toml changes require one.
      - .:/app
    environment:
      # pytest gets this from `pythonpath` in pyproject.toml, but ad-hoc
      # `python -c` / `python -m poseydon.cli` runs need it explicitly, since the
      # image installs dependencies without installing the project itself.
      PYTHONPATH: /app/src:/app
      # Matplotlib wants a writable config dir, and the container runs as a user
      # with no home.
      MPLCONFIGDIR: /tmp/matplotlib
    command: pytest -v

  # Reference comparison only. Not used by the test suite.
  compat:
    build:
      context: .
      dockerfile: Dockerfile.compat
    working_dir: /app
    # Same reason as the test service: artifacts it writes must belong to you.
    # Bash does not export UID, so ${UID:-1000} always defaulted to 1000 until .env
    # was added; Compose loads .env automatically.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
      - hf-cache:/root/.cache/huggingface
    environment:
      PYTHONPATH: /app/src:/app
      MPLCONFIGDIR: /tmp/matplotlib
      XDG_CACHE_HOME: /tmp/cache
    command: python -c "import Animation, BVH, Quaternions; print('Motion available')"

  # FBX preprocessing. Blender headless; see Dockerfile.fbx for why it is a
  # separate image. Blender needs a writable HOME for its config, and runs the
  # script itself rather than a bare interpreter:
  #   docker compose run --rm fbx blender -b --python scripts/process_dataset_truebones_fbx.py
  fbx:
    build:
      context: .
      dockerfile: Dockerfile.fbx
    working_dir: /app
    # Same reason as the test service: artifacts it writes must belong to you.
    # Bash does not export UID, so ${UID:-1000} always defaulted to 1000 until .env
    # was added; Compose loads .env automatically.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
    environment:
      # Same reason as the test service: the image installs no project, so
      # `poseydon.io.fbx` is found on the path rather than by installation.
      PYTHONPATH: /app/src:/app
      # Blender wants a writable HOME for its config; the container has none.
      HOME: /tmp
    command: blender --version

volumes:
  hf-cache:
