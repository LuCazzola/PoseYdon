skeleton: Anaconda
rest_pose: __TPOSE_authored.bvh   # authored T-pose (tools/tpose_author.py)
promote_root: Hips   # the FBX roots at static Null above the body's root joint (the BVH left them out)
facing:
  # A snake has no left/right pair, so the pair runs along the head bone
  # (neck -> head, pointing backward) and extra_yaw_deg turns the
  # across-body axis it gives into the head's direction.
  head:      {right: BN_Neck, left: BN_Head}
  extra_yaw_deg: -90
foot_joints:
  - Hips
  - BN_Tail_01
  - BN_Tail_02
  - BN_Tail_03
  - BN_Tail_04
  - BN_Tail_05
  - BN_Tail_06
  - BN_Tail_07
  - BN_Tail_08
  - BN_Tail_09
  - BN_Tail_10
  - BN_Tail_11
  - BN_Tail_12
  - BN_Tail_13
  - BN_Spline_01
  - BN_Spline_02
  - BN_Spline_03
  - BN_Spline_04
  - BN_Spline_05
  - BN_Spline_06
  - BN_Neck
  - BN_Head
  - BN_Jaw
  - BN_Tone_01
  - BN_Tone_02
  - BN_Tone_03
  - BN_Tone_04
tags: [snake]

authority:
  skeleton: fbx
  motion: fbx
  surface: fbx
  auxiliary_joints: bake
artifacts:
  bvh: __TPOSE_authored.bvh
  fbx: 'AnacondaALL-Attack.fbx'
  textures: null
